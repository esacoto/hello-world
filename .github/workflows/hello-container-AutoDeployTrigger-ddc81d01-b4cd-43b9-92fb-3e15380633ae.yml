name: Trigger auto deployment for hello-container

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ develop ]
    paths:
    - '**'
    - '.github/workflows/hello-container-AutoDeployTrigger-ddc81d01-b4cd-43b9-92fb-3e15380633ae.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.HELLOCONTAINER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.HELLOCONTAINER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.HELLOCONTAINER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.HELLOCONTAINER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.HELLOCONTAINER_REGISTRY_PASSWORD }}
          containerAppName: hello-container
          resourceGroup: main
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


